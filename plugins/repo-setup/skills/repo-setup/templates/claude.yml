name: Claude

# On-demand: mention @claude in a PR or issue comment (e.g. "@claude explain this
# again", "@claude fix the failing test"). Only the owner, members and
# collaborators trigger it, so a stranger's comment can't drive a write-access run.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      ((contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       github.event_name == 'issues' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mtblck/claude-marketplace.git
          plugins: |
            pr-review@mtblck
            dependency-review@mtblck
            repo-setup@mtblck
            superpowers@mtblck
